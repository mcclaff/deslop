name: release

# Push a tag such as v1.1.0 to publish a release with the claude.ai upload attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deslop.zip (deslop/SKILL.md, deslop/LICENSE, deslop/scripts)
        run: git archive --format=zip --prefix=deslop/ -o deslop.zip HEAD SKILL.md LICENSE scripts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" deslop.zip --title "$GITHUB_REF_NAME" --generate-notes
