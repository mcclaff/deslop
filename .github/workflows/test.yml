name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ubuntu blocks the user namespaces Chrome's sandbox needs. Allow them for this runner.
      - name: Let Chrome start its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run the checker against the test pages
        run: node tests/run.mjs
